# Public entrypoint. The app lives under /verse; the prefix is stripped before
# requests reach the server (which owns /api, /socket.io, /uploads) and the
# client container (which serves the SPA from its root).

# Docker's embedded DNS — re-resolve `server` so scaled/restarted replicas are picked up.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream pv_server {
  zone pv_server 64k;
  least_conn;
  server server:4000 resolve;
}

upstream pv_client {
  zone pv_client 64k;
  server client:8080 resolve;
}

server {
  listen 80;
  server_name _;

  absolute_redirect off;           # keep redirects relative so the public host/port (or outer proxy) is preserved
  client_max_body_size 12m;        # multer caps uploads at 10MB
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # WebSocket — long timeouts or idle socket.io connections are cut every 60s
  location /verse/socket.io/ {
    proxy_pass http://pv_server/socket.io/;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  location /verse/api/ {
    proxy_pass http://pv_server/api/;
    proxy_read_timeout 120s;
  }

  location /verse/uploads/ {
    proxy_pass http://pv_server/uploads/;
    expires 7d;
  }

  location = /verse {
    return 301 /verse/;
  }

  location /verse/ {
    proxy_pass http://pv_client/;
  }

  location = /healthz {
    access_log off;
    return 200 "ok\n";
  }

  location / {
    return 301 /verse/;
  }
}
