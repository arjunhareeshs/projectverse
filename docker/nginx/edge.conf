upstream pv_server {
  least_conn;
  server server:4000;
}

upstream pv_client {
  server client:8080;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 12m;        # multer caps at 10MB (xlsx import, lifecycle assets)
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # WebSocket — strip /verse before forwarding to Socket.IO, and use a long
  # read timeout or idle socket.io connections are cut every 60s
  location /verse/socket.io/ {
    proxy_pass http://pv_server/socket.io/;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
  }

  # The backend owns /api, so remove the public /verse prefix.
  location = /verse/api {
    proxy_pass http://pv_server/api/;
    proxy_read_timeout 120s;
  }

  location /verse/api/ {
    proxy_pass http://pv_server/api/;
    proxy_read_timeout 120s;
  }

  location /verse/uploads/ {
    proxy_pass http://pv_server/uploads/;
    expires 7d;
  }

  location = /verse {
    return 301 /verse/;
  }

  location /verse/ {
    proxy_pass http://pv_client/;
  }

  location / {
    return 404;
  }
}
